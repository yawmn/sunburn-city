<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SUNBURN CITY: an offline Canvas 2D open-world crime game set in an iconic 1980s neon coastal metropolis.">
<title>SUNBURN CITY</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090b10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    display: block;
    touch-action: none;
    background: #000;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body data-errors="">
<canvas id="game" width="1280" height="720" aria-label="Sunburn City: an open-world crime game set in a sun-soaked 1980s coastal city"></canvas>
<p id="status" role="status" aria-live="polite">Loading Sunburn City...</p>

<script>
  window.__errors = [];
  function captureError(err) {
    const msg = (err && (err.message || err.reason?.message || String(err))) || 'Unknown error';
    window.__errors.push(msg);
    const status = document.getElementById('status');
    if (status) status.textContent = msg;
    document.body.dataset.errors = window.__errors.join(' | ');
  }
  window.addEventListener('error', (e) => captureError(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => captureError(e.reason));
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
